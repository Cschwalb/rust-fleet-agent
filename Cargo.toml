[workspace]
resolver = "2"
members = ["common", "agent", "controller"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.74"

[workspace.dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
# Pin the `ring` crypto provider: no C toolchain needed, so cross-compiling to
# the Windows MSVC target from Linux/macOS stays simple.
tokio-rustls = { version = "0.26.0", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23.13", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.1.3"
rcgen = "0.13.1"
sha2 = "0.10.8"
anyhow = "1.0.89"
thiserror = "1.0.64"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
clap = { version = "4.5.18", features = ["derive"] }
toml = "0.8.19"
sysinfo = "0.32.0"
directories = "5.0.1"
